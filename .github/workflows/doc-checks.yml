name: Doc checks

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-checks:
    name: Decision log, links and private data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # The same uv in each repo. A release at least 14 days old.
          python-version: "3.13.18"
      # The doc checks need only pytest. pyproject.toml has it in the dev group.
      - run: uv sync --only-group dev
      # T-PRV-25 imports skellycam, which this job does not install: it runs in the capture jobs (preview-4b.md 7.8, Q836)
      - run: uv run --no-sync pytest tools/tests --ignore=tools/tests/test_camera_message_fixture.py
