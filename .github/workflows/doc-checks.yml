name: Doc checks

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doc-checks:
    name: Decision log, links and private data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.13.18"
      # The doc checks need only pytest, not the camera stack of the package.
      - run: uv sync --only-group dev
      - run: uv run --no-sync pytest tools/tests
