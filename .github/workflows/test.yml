name: Tests

on:
  pull_request:
    branches: [main, development]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13.18"]
        include:
          - os: windows-latest
            python-version: "3.13.18"
          - os: macos-latest
            python-version: "3.13.18"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run linter (ruff)
        run: uv run ruff check skellycam/

      - name: Run tests
        run: uv run pytest skellycam/tests/ -m "not pace" -v --tb=short

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
        run: |
          status=0
          uv run pytest skellycam/tests/ -m "pace" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: skellycam-ui

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: skellycam-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit
