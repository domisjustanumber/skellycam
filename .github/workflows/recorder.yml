name: Recorder

# specs/recorder.md section 12.1 [C4, agent 34]: the unit and process tests of step 5a, the short pass
# parts of T-REC-STALL and T-REC-KILL, and T-REC-37 on Windows, Linux and macOS. The benchmarks
# (marker recorder_bench) run only on the machines of the user. A skipped connection test fails the run
# (SKELLYCAM_NO_SKIP, unix-capture.md 4.11). The tests with the marker `pace` run in their own step (Q619).
on:
  push:
    branches: [dom/recorder, dom/integration]
    paths:
      - "skellycam/core/take_recorder/**"
      - "skellycam/tests/take_recorder/**"
      - "specs/recorder.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/recorder.yml"
  workflow_dispatch:

concurrency:
  group: recorder-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # unix-capture.md 4.11 [ADR-HQE5]: a skipped connection test fails the run (a module skip hid them on Linux).
  SKELLYCAM_NO_SKIP: skellycam/tests/take_recorder/test_connection.py
  # T-REC-37 exports the conformance tests of this commit (specs/recorder.md section 12.3).
  SKELLYFILEFORMAT_DIR: ${{ github.workspace }}/.skellyfileformat
  SKELLYFILEFORMAT_COMMIT: 24949df6c22093336c30b279c396ef593648de1e

jobs:
  recorder-windows:
    name: Recorder tests (Python 3.13.18, windows-2025)
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # When this checkout fails, T-REC-37 is skipped with its reason; the other tests still run.
      - name: Check out skellyfileformat for T-REC-37
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domisjustanumber/skellyfileformat
          ref: ${{ env.SKELLYFILEFORMAT_COMMIT }}
          path: .skellyfileformat
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Run the recorder tests
        run: uv run pytest skellycam/tests/take_recorder -m "not recorder_bench and not pace"

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
        run: |
          status=0
          uv run pytest skellycam/tests/take_recorder -m "pace and not recorder_bench" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"

  recorder-linux:
    name: Recorder tests (Python 3.13.18, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # When this checkout fails, T-REC-37 is skipped with its reason; the other tests still run.
      - name: Check out skellyfileformat for T-REC-37
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domisjustanumber/skellyfileformat
          ref: ${{ env.SKELLYFILEFORMAT_COMMIT }}
          path: .skellyfileformat
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      # The tests' conftest imports sounddevice. Its Linux wheel does not hold PortAudio.
      - name: Install PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2=19.6.0-1.2build3

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Run the recorder tests
        run: uv run pytest skellycam/tests/take_recorder -m "not recorder_bench and not pace"

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
        run: |
          status=0
          uv run pytest skellycam/tests/take_recorder -m "pace and not recorder_bench" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"

  # Apple Silicon. opencv-contrib-python 5.1.0.95 has macOS wheels for macOS 15 and later only. The
  # sounddevice wheel for macOS holds PortAudio, so no install step is necessary.
  recorder-macos:
    name: Recorder tests (Python 3.13.18, macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # When this checkout fails, T-REC-37 is skipped with its reason; the other tests still run.
      - name: Check out skellyfileformat for T-REC-37
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: domisjustanumber/skellyfileformat
          ref: ${{ env.SKELLYFILEFORMAT_COMMIT }}
          path: .skellyfileformat
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Run the recorder tests
        run: uv run pytest skellycam/tests/take_recorder -m "not recorder_bench and not capture_timing and not pace"

      # The tests of real-time gaps of 100 ms in their own step, as in capture.yml: this runner can be slow
      # (ADR-BM73). T-REC-44 is one of them.
      - name: Run the real-time gap tests
        if: ${{ !cancelled() }}
        run: uv run pytest skellycam/tests/take_recorder -m "capture_timing and not recorder_bench and not pace"

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
        run: |
          status=0
          uv run pytest skellycam/tests/take_recorder -m "pace and not recorder_bench" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"
