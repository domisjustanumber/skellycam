name: Player

# specs/player.md section 12.6: the unit, component and electron tests of the step 6a player on Windows,
# Linux and macOS (Y7). The benchmarks do not run here. Each job also runs the unit tests of the cameras slice
# (`npm run test:cameras`) in a step of its own. The step 4b preview component tests start a Python server with
# uv, so each job installs uv, Python and the dev group as capture.yml does (specs/preview-4b.md 7.8, ADR-S1DJ).
on:
  push:
    branches: [dom/player, dom/native-jpeg, dom/integration]
    paths:
      - "skellycam-ui/src/player/**"
      - "skellycam-ui/src/components/playback/**"
      - "skellycam-ui/src/store/slices/**"
      - "skellycam-ui/src/services/server/**"
      - "skellycam-ui/src/components/camera-views/**"
      - "skellycam/tests/preview/**"
      - "specs/preview-4b.md"
      - "skellycam-ui/electron/**"
      - "skellycam-ui/package.json"
      - "skellycam-ui/package-lock.json"
      - "skellycam-ui/tsconfig.json"
      - "skellycam-ui/vite.player-harness.config.ts"
      - "skellycam-ui/playwright.player.config.ts"
      - "specs/player.md"
      - ".github/workflows/player.yml"
  pull_request:
    paths:
      - "skellycam-ui/src/player/**"
      - "skellycam-ui/src/components/playback/**"
      - "skellycam-ui/src/store/slices/**"
      - "skellycam-ui/src/services/server/**"
      - "skellycam-ui/src/components/camera-views/**"
      - "skellycam/tests/preview/**"
      - "specs/preview-4b.md"
      - "skellycam-ui/electron/**"
      - "skellycam-ui/package.json"
      - "skellycam-ui/package-lock.json"
      - "skellycam-ui/tsconfig.json"
      - "skellycam-ui/vite.player-harness.config.ts"
      - "skellycam-ui/playwright.player.config.ts"
      - "specs/player.md"
      - ".github/workflows/player.yml"
  workflow_dispatch:

concurrency:
  group: player-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  player-windows:
    name: Player tests (Node 26.13.1, windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skellycam-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: skellycam-ui/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install the Python dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Install dependencies
        id: deps
        run: npm ci

      - name: Run the unit tests
        run: npm run test:player:unit

      - name: Run the unit tests of the cameras slice
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:cameras

      - name: Run the component and electron tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:player:browser

  player-linux:
    name: Player tests (Node 26.13.1, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skellycam-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: skellycam-ui/package-lock.json

      # Electron needs a display on Linux (spec 12.5). The runner image has xvfb, and the image label
      # ubuntu-24.04 is the pin: an apt pin in noble-updates goes away at the next update (ADR-5FBS).
      - name: Check xvfb
        run: |
          echo "xvfb $(dpkg-query -W -f='${Version}' xvfb)"
          command -v xvfb-run

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      # The preview server imports sounddevice. Its Linux wheel does not hold PortAudio.
      - name: Install PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2=19.6.0-1.2build3

      - name: Install the Python dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Install dependencies
        id: deps
        run: npm ci

      - name: Run the unit tests
        run: npm run test:player:unit

      - name: Run the unit tests of the cameras slice
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:cameras

      - name: Run the component and electron tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: xvfb-run --auto-servernum npm run test:player:browser

  # GitHub has few macOS runners: no other job waits for this job, and a newer push cancels it.
  player-macos:
    name: Player tests (Node 26.13.1, macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: player-macos-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: skellycam-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: skellycam-ui/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install the Python dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Install dependencies
        id: deps
        run: npm ci

      - name: Run the unit tests
        run: npm run test:player:unit

      - name: Run the unit tests of the cameras slice
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:cameras

      - name: Run the component and electron tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:player:browser
