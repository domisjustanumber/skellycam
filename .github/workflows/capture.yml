name: Capture

# specs/windows-capture.md section 15: the fake-source and OpenCV-source tests of phase 3 on Windows,
# Linux and macOS (U20). The macOS job also runs the portable frame ring tests. The tests with the
# markers camera_hardware and capture_local do not run here.
on:
  push:
    branches: [dom/native-jpeg]
    paths:
      - "skellycam/core/camera/**"
      - "skellycam/core/camera_group/**"
      - "skellycam/core/device_detection/**"
      - "skellycam/core/recorders/**"
      - "skellycam/core/timestamps/**"
      - "skellycam/core/ipc/frame_ring/**"
      - "skellycam/api/**"
      - "skellycam/tests/**"
      - "specs/windows-capture.md"
      - "specs/frame-ring.md"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/capture.yml"
  workflow_dispatch:

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-windows:
    name: Capture fake-source tests (Python 3.13.18, windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      # T-CAP-46 (load the Media Foundation module) is one of these tests; it runs on Windows only.
      - name: Run the fake-source tests
        run: uv run pytest skellycam/tests/capture -m "not camera_hardware and not capture_local"

  capture-linux:
    name: Capture fake-source tests (Python 3.13.18, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      # The tests' conftest imports sounddevice. Its Linux wheel does not hold PortAudio.
      - name: Install PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2=19.6.0-1.2build3

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Run the fake-source tests
        run: uv run pytest skellycam/tests/capture -m "not camera_hardware and not capture_local"

  # Apple Silicon (U20). opencv-contrib-python 5.1.0.95 has macOS wheels for macOS 15 and later only.
  # GitHub has few of these runners: no other job waits for this job, and a newer push cancels it.
  # The sounddevice wheel for macOS holds PortAudio, so no install step is necessary.
  capture-macos:
    name: Capture fake-source tests and portable ring tests (Python 3.13.18, macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: capture-macos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Run the fake-source tests
        run: uv run pytest skellycam/tests/capture -m "not camera_hardware and not capture_local and not capture_timing"

      # The tests of real-time gaps of 100 ms in their own step: this runner can be slow (ADR-BM73).
      - name: Run the real-time gap tests
        if: ${{ !cancelled() }}
        run: uv run pytest skellycam/tests/capture -m "capture_timing and not camera_hardware and not capture_local"

      - name: Run the portable ring tests
        if: ${{ !cancelled() }}
        env:
          SKELLYCAM_RING_FULL: "1"
        run: uv run pytest skellycam/tests/frame_ring -m ring_portable -q

      # temporary: macOS diagnosis, remove before the branch is merged
      # ADR-FTC3: three runs with the clock rules and the clock trace, then three runs with the old clock
      # (SKELLYCAM_CLOCK_RULES_OFF=1), whose failure reports show the participants at each far step.
      - name: "Temporary: repeat the clock tests of the macOS failures"
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          tests="skellycam/tests/capture/test_states.py::test_t_cap_108_a_dying_camera_does_not_hold_the_others
          skellycam/tests/capture/test_states.py::test_t_cap_13_warm_up_and_wait_for_the_others
          skellycam/tests/capture/test_shared_loop.py::test_t_cap_11_discontinuity_reaches_the_next_taken_frame"
          status=0
          for run in 1 2 3; do
            SKELLYCAM_CLOCK_TRACE=1 uv run pytest $tests -v -p no:cacheprovider || status=1
          done
          for run in 1 2 3; do
            SKELLYCAM_CLOCK_RULES_OFF=1 uv run pytest $tests -v -p no:cacheprovider || status=1
          done
          exit $status
