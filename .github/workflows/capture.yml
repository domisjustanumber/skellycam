name: Capture

# specs/windows-capture.md section 15: the fake-source and OpenCV-source tests of phase 3 on Windows,
# Linux and macOS (U20). The macOS job runs only by hand (ADR-N14T). It also runs the portable frame ring tests. The tests with the
# markers camera_hardware and capture_local do not run here. The jobs also run the step 4a preview tests
# with fake rings (specs/preview.md section 9.4, P7).
on:
  push:
    branches: [dom/native-jpeg, dom/integration]
    paths:
      - "skellycam/core/camera/**"
      - "skellycam/core/camera_group/**"
      - "skellycam/core/device_detection/**"
      - "skellycam/core/recorders/**"
      - "skellycam/core/timestamps/**"
      - "skellycam/core/ipc/frame_ring/**"
      - "skellycam/api/**"
      - "skellycam/tests/**"
      - "specs/windows-capture.md"
      - "specs/preview.md"
      - "specs/frame-ring.md"
      - "specs/preview-4b.md"
      - "tools/write_camera_message_fixture.py"
      - "tools/tests/test_camera_message_fixture.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/capture.yml"
  workflow_dispatch:

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture-windows:
    name: Capture fake-source tests (Python 3.13.18, windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      # T-CAP-46 (load the Media Foundation module) is one of these tests; it runs on Windows only.
      - name: Run the fake-source tests and the preview tests
        run: uv run pytest skellycam/tests/capture skellycam/tests/preview tools/tests/test_camera_message_fixture.py -m "not camera_hardware and not capture_local and not pace"

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
        run: |
          status=0
          uv run pytest skellycam/tests/capture skellycam/tests/preview -m "pace and not camera_hardware and not capture_local" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"

  capture-linux:
    name: Capture fake-source tests (Python 3.13.18, ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      # The tests' conftest imports sounddevice. Its Linux wheel does not hold PortAudio.
      - name: Install PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2=19.6.0-1.2build3

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Run the fake-source tests and the preview tests
        run: uv run pytest skellycam/tests/capture skellycam/tests/preview tools/tests/test_camera_message_fixture.py -m "not camera_hardware and not capture_local and not pace"

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
        run: |
          status=0
          uv run pytest skellycam/tests/capture skellycam/tests/preview -m "pace and not camera_hardware and not capture_local" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"

  # Apple Silicon (U20). opencv-contrib-python 5.1.0.95 has macOS wheels for macOS 15 and later only.
  # GitHub has few of these runners: no other job waits for this job, and a newer push cancels it.
  # The sounddevice wheel for macOS holds PortAudio, so no install step is necessary.
  # It runs only by hand (ADR-N14T): on a push, often no hosted macos-15 runner took the job.
  capture-macos:
    name: Capture fake-source tests and portable ring tests (Python 3.13.18, macos-15 arm64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 40
    concurrency:
      group: capture-macos-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Set up Python 3.13.18
        run: uv python install 3.13.18

      - name: Install dependencies
        run: uv sync --group dev --python 3.13.18

      - name: Run the fake-source tests and the preview tests
        run: uv run pytest skellycam/tests/capture skellycam/tests/preview tools/tests/test_camera_message_fixture.py -m "not camera_hardware and not capture_local and not capture_timing and not pace"

      # The tests of real-time gaps of 100 ms in their own step: this runner can be slow (ADR-BM73).
      - name: Run the real-time gap tests
        if: ${{ !cancelled() }}
        run: uv run pytest skellycam/tests/capture skellycam/tests/preview -m "capture_timing and not camera_hardware and not capture_local and not pace"

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests of capture
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
        run: |
          status=0
          uv run pytest skellycam/tests/capture skellycam/tests/preview -m "pace and not camera_hardware and not capture_local" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"

      - name: Run the portable ring tests
        if: ${{ !cancelled() }}
        env:
          SKELLYCAM_RING_FULL: "1"
        run: uv run pytest skellycam/tests/frame_ring -m "ring_portable and not pace" -q

      # Q619 of the user ("A red workflow should mean a real fault"): the tests with the marker `pace` run here with
      # wide margins. A failure shows as a failed step, a warning and lines in the job summary; the job stays green.
      - name: Run the pace tests of the ring
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          SKELLYCAM_PACE_MARGIN: "3"
          SKELLYCAM_RING_FULL: "1"
        run: |
          status=0
          uv run pytest skellycam/tests/frame_ring -m "ring_portable and pace" -rfE > pace.log 2>&1 || status=$?
          cat pace.log
          if [ "$status" -eq 5 ]; then status=0; fi
          { echo "### Pace tests (reported, not blocking: Q619)"; echo '```'; grep -E '^(FAILED|ERROR)|(passed|failed|error)' pace.log | tail -n 20 || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then echo "::warning title=Pace tests::pace tests failed on this runner (reported, not blocking: Q619)"; fi
          exit "$status"
