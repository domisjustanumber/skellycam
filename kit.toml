# The values of this repository for the kit tools (decision 0001). This repository owns this file.
# tools/kit_sync.py fills each placeholder of the kit text with a value of [values]. The check tools
# read their tables. Each commented line gives the default.

[sync]
# adopt = ["AGENTS.md#writing-rules"]  # Only these unit IDs of the kit manifest. Default: all units.
# skip = [".github/workflows/doc-checks.yml"]  # The unit IDs that this repository does not take.
# kit = "../project"  # The path of the freemocap/project checkout.

[values]
DEFAULT_BRANCH_TEXT = "upstream `development`"  # The branch that PRs target, as Markdown text (decisions EQY4, X1T8 Q655).
AREAS = "the code, the CI"  # What an agent must not change before it reads the decision log.
NORMATIVE_DOCS = "the specs in `specs/`"  # The binding documents (decision 2S1P, item 4).
SIBLING_PATH = "../skellyfileformat/spec/"  # A path relative to the repository, as an example in AGENTS.md.
SECRET_SCAN_BRANCHES = "[main, development, development-streaming]"  # The branches of a PR that the secret scan checks.
PYTHON_VERSION = "3.13.18"  # The Python of the doc checks in CI. The same as pyproject.toml.
# For the other-systems rule, before it goes into the kit (decision 3SRX): the block AGENTS.md#other-systems
# and the skill verify-on-other-systems. No kit unit uses them yet.
SELF_TEST = "skellycam.certify"  # The self-test of the project, as AGENTS.md and the skills name it.
CERTIFY_SPEC = "specs/certify.md"  # The spec that holds the certify check names.
CERTIFY_REPO = "skellycertify"  # The repository of the certify contract report-format.md.

[check_decision_log]
# module_logs = ["server/decisions"]  # The folder of each module log.
# old_log_dirs = []  # A folder where a log was before a move.
target_branch = "development"  # The PR branch: upstream `development` (decision EQY4).
index_limit = 24_000  # Was 14_000 (decisions N2NH and XT31). A PR that raises a limit must add an entry.
# read_path_limit = 220_000
# last_unlimited_entry = 0

[check_private_data]
allowed_emails = ["info@freemocap.org"]  # The public contact address of the project.

# Decision I of JMS0 (2026-11-20): a reviewed line, by its path, its line number and the SHA-256 of its text.
[[check_private_data.allowed_lines]]
path = "skellycam-ui/src/hooks/floatingOnboarding.tsx"
line = 1
sha256 = "70d514cd447c3acfa67678f424813f7219a6820a0d1bb02bd319800e482e93b0"
reason = "upstream author credit"

[[check_private_data.allowed_lines]]
path = "skellycam-ui/src/hooks/useDraggableTooltips.tsx"
line = 1
sha256 = "2b9a3455ee945850201dde0ba48d187a94f492d5fdf3964dfe818d1b3252ee4e"
reason = "upstream author credit"

[check_links]
doc_paths = ["specs/", "notes/"]  # The docs that the link check covers. The same as the kit default.
skipped_folders = []  # No folder of frozen copies.

[check_camera_media]
golden_paths = []  # skellycam has no golden reference files yet, so nothing is allowed.

# tools/check_other_systems.py (decisions VV4Q, K3BX, C307, K9B7; values moved here by decision 3SRX).
[check_other_systems]
exempt_paths = ["skellycam/", "skellycam-ui/", "skellycam-docs/", ".github/"]  # The product folders and CI.
certify_spec = "specs/certify.md"  # The spec that holds the check names.
self_test = "skellycam.certify"  # The self-test, in the advice of a refusal line.
certify_contract = "report-format.md of the skellycertify repository"  # In the refusal line for a new check.

# The table [kit] is written by tools/kit_sync.py pull and propose. Do not edit it.
[kit]
commit = "10efc2bf3a75410a1838917fa62fb0e5b6c4de19"
values = "2f366f304a77ccee44227cb198a6109555fc2358c5fa33a1b1a97ef8a287b37e"

