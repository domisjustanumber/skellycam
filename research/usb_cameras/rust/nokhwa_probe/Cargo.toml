[package]
name = "nokhwa_probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Capture raw MJPEG via nokhwa (MSMF/V4L2/AVFoundation) and log per-frame timing (README frame-log schema)"

[dependencies]
# default-features = false drops the `decoding` feature (mozjpeg); we want the raw buffer only.
nokhwa = { version = "=0.10.11", default-features = false, features = ["input-native"] }
serde_json = "1"
# Used only to validate that a sample of frames actually decode as JPEG (not in the capture path).
zune-jpeg = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Performance",
    "Win32_Media_MediaFoundation",
    "Win32_Media_DirectShow",
    "Win32_System_SystemInformation",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
