[package]
name = "uvc_iso"
version = "0.1.0"
edition = "2021"
publish = false
description = "From-scratch UVC MJPEG streaming over USB isochronous transfers; rawusb (pure Rust) or libusb (vendored C) backend"

[features]
default = ["rawusb"]
rawusb = ["dep:rawusb"]
libusb = ["dep:libusb1-sys"]

[dependencies]
serde_json = "1"
# timeval for libusb on all OSes; clock_gettime / mach_absolute_time for hostclock on unix
libc = "0.2"
rawusb = { version = "=0.1.7", optional = true }
libusb1-sys = { version = "=0.7.0", features = ["vendored"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Performance",
    "Win32_Devices_Usb",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

