<!doctype html><meta charset="utf-8"><title>crashed audio test</title>
<canvas id="c" width="1" height="1"></canvas>
<!-- the planned player's code, unchanged: WcEngine (index: WAV header / fMP4 moof walk; windowed WebCodecs decode,
     80 ms Opus pre-roll, output placed by decoder timestamps) and fetchRange -->
<script src="player.js"></script>
<script>
function b64(f32) {
  const i16 = new Int16Array(f32.length);
  for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32768)));
  const u8 = new Uint8Array(i16.buffer); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
}
const until = (p, ms) => Promise.race([p, sleep(ms).then(() => 'timeout')]);

async function testFile(f) {
  const r = {};
  // 1. skellycam's planned player engine (wc)
  if (f.name.endsWith('.mka')) r.wc = { skipped: 'the planned indexer reads WAV, FLAC and fMP4 only' };
  else {
    const e = new WcEngine(); const t0 = performance.now();
    try {
      await e.load(f.name);
      r.wc = { loadMs: +(performance.now() - t0).toFixed(1), bytes: e.bytes, kind: e.kind, frames: e.frames, preskip: e.preskip, dataOff: e.dataOff,
        indexedEndUntrimmed: e.kind === 'opus' && e.frames ? e.s[e.frames - 1] + 960 : null, lastSize: e.kind === 'opus' && e.frames ? e.size[e.frames - 1] : null, seeks: [] };
      for (const n of f.targets) {
        const s = { n }; const t1 = performance.now();
        try { const x = await e.pcm(n, 2 * SR); s.ms = +(performance.now() - t1).toFixed(1); s.data = b64(x); }
        catch (err) { s.error = String(err && err.message || err).slice(0, 200); }
        s.decoderError = e.err || null; e.err = null;
        r.wc.seeks.push(s);
      }
    } catch (err) { r.wc = { loadError: String(err && err.message || err).slice(0, 200) }; }
  }
  // 2. decodeAudioData of the whole file: length, and the click offsets over the whole file (found - expected)
  try {
    const t0 = performance.now();
    const ab = await (await fetch(url(f.name))).arrayBuffer();
    const buf = await new OfflineAudioContext(1, SR, SR).decodeAudioData(ab);
    const x = buf.getChannelData(0), offs = {};
    for (let e = 24000; e + 24000 <= x.length; e += 48000) {
      let bi = e - 24000; for (let i = e - 24000; i < e + 24000; i++) if (Math.abs(x[i]) > Math.abs(x[bi])) bi = i;
      offs[bi - e] = (offs[bi - e] || 0) + 1;
    }
    let lastNz = x.length - 1; while (lastNz >= 0 && Math.abs(x[lastNz]) < 1e-4) lastNz--;
    r.decodeAudioData = { ms: +(performance.now() - t0).toFixed(1), length: buf.length, lastNonzero: lastNz, clickOffsets: offs };
  } catch (err) { r.decodeAudioData = { error: String(err && err.message || err).slice(0, 200) }; }
  // 3. <audio>: metadata, currentTime seeks to every target, then play the last 0.5 s to 'ended'
  const a = new Audio(); a.muted = true; a.preload = 'auto';
  try {
    const t0 = performance.now();
    const meta = await until(new Promise((res, rej) => { a.onloadedmetadata = res; a.onerror = () => rej(new Error('media error ' + (a.error && a.error.code) + ' ' + (a.error && a.error.message))); a.src = url(f.name); }), 30000);
    if (meta === 'timeout') throw new Error('loadedmetadata timeout');
    r.el = { metaMs: +(performance.now() - t0).toFixed(1), duration: a.duration, seekableEnd: a.seekable.length ? a.seekable.end(0) : null, seeks: [] };
    for (const n of f.targets) {
      const t1 = performance.now();
      const ok = await until(new Promise((q) => { a.onseeked = q; a.currentTime = n / SR; }), 8000);
      r.el.seeks.push({ n, seekedAt: a.currentTime, ms: +(performance.now() - t1).toFixed(1), timeout: ok === 'timeout', error: a.error ? a.error.code : null });
    }
    const L = f.L / SR;
    await until(new Promise((q) => { a.onseeked = q; a.currentTime = Math.max(0, L - 0.5); }), 8000);
    const t2 = performance.now();
    const ended = await until(new Promise((q) => { a.onended = q; a.play().catch((e) => q('play error ' + e.message)); }), 4000);
    r.el.playToEnd = { from: L - 0.5, ended: ended === 'timeout' ? 'timeout' : (typeof ended === 'string' ? ended : 'ended'), ms: +(performance.now() - t2).toFixed(1), currentTime: a.currentTime, duration: a.duration };
  } catch (err) { r.el = Object.assign(r.el || {}, { error: String(err && err.message || err).slice(0, 200) }); }
  finally { a.pause(); a.removeAttribute('src'); a.load(); }
  return r;
}
</script>
