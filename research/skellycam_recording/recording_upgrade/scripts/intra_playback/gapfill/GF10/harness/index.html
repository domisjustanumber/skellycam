<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chromium_sync_scrub harness</title>
<style>
  html, body { margin: 0; background: #000; color: #ccc; font: 12px monospace; height: 100%; overflow: hidden; }
  #grid { display: grid; gap: 2px; width: 100vw; height: calc(100vh - 18px); }
  #grid > * { width: 100%; height: 100%; object-fit: contain; background: #111; min-width: 0; min-height: 0; }
  #status { height: 18px; white-space: nowrap; overflow: hidden; }
</style>
</head>
<body>
<div id="status">starting</div>
<div id="grid"></div>
<script type="module" src="harness.mjs"></script>
</body>
</html>
