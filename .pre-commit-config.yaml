# Install the hooks once in each worktree with the two commands of AGENTS.md section 3 (decision 0001).
# Do not run `pre-commit install`: the worktrees of this clone share one hooks folder.
# The scripts in .githooks/ run the pre-commit hooks, the commit-msg hook and the pre-push hook.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: private-data
        name: private data
        entry: uv run python tools/check_private_data.py
        language: system
        pass_filenames: false
      # A camera recording or a camera frame in the files of the commit. Golden reference files pass.
      # The hook also prints a reminder for an image. The reminder does not stop the commit.
      - id: camera-media
        name: camera recordings and frames
        entry: uv run python tools/check_camera_media.py
        language: system
        verbose: true
      # An entry ID that a different file has on another branch or worktree.
      - id: decision-log-ids
        name: decision log IDs
        entry: uv run python tools/check_decision_log.py --collisions
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # AI attribution in a commit message. The hook warns. It does not stop the commit.
      - id: ai-attribution
        name: AI attribution
        entry: uv run python tools/check_ai_attribution.py
        language: system
        stages: [commit-msg]
        verbose: true
